services:
  web:
    image: nginx
    volumes:
      - hi-bataafse-politieke-tijdschriften-html:/usr/share/nginx/html
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.bataafse-politieke-tijdschriften.loadbalancer.server.port=80"
      - "traefik.http.routers.bataafse-politieke-tijdschriften.entrypoints=http"
      - "traefik.http.routers.bataafse-politieke-tijdschriften.rule=Host(`bataafse-politieke-tijdschriften.huygens.knaw.nl`)"
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - hi-bataafse-politieke-tijdschriften-html:/app/repo/html

volumes:
  hi-bataafse-politieke-tijdschriften-html:

networks:
  traefik-public:
    external: true